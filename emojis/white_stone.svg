<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="white-stone-fill" cx="36%" cy="34%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#f4f4f4"/>
      <stop offset="70%" stop-color="#dedede"/>
      <stop offset="100%" stop-color="#b4b4b4"/>
    </radialGradient>
    <radialGradient id="white-specular" cx="42%" cy="38%" r="45%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Main stone body with contrasting dark rim -->
  <circle cx="64" cy="64" r="58" fill="url(#white-stone-fill)" stroke="#484848" stroke-width="5" />
  <!-- 3D Convex Glint -->
  <ellipse cx="50" cy="46" rx="30" ry="16" transform="rotate(-28 50 46)" fill="url(#white-specular)" />
</svg>
