<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="black-stone-fill" cx="36%" cy="34%" r="65%">
      <stop offset="0%" stop-color="#555555"/>
      <stop offset="30%" stop-color="#2a2a2a"/>
      <stop offset="70%" stop-color="#121212"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <radialGradient id="black-specular" cx="42%" cy="38%" r="45%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Main stone body with contrasting rim -->
  <circle cx="64" cy="64" r="58" fill="url(#black-stone-fill)" stroke="#9c9c9c" stroke-width="5" />
  <!-- 3D Convex Glint -->
  <ellipse cx="50" cy="46" rx="30" ry="16" transform="rotate(-28 50 46)" fill="url(#black-specular)" />
</svg>
