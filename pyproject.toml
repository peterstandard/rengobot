[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "W191",  # Indentation contains tabs (tabs explicitly preferred)
    "E501",  # Line length handled by formatter
]

[tool.ruff.format]
indent-style = "tab"
quote-style = "double"
line-ending = "lf"
